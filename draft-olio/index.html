<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Huile d'olive de Bitetto</title>
  <meta name="description" content="Huile d'olive extra vierge de Bitetto (BA) - 20 CHF/litre, bidons de 3L ou 5L." />
  <style>
    :root {
      --olive: #5f6f3a;
      --olive-dark: #32401a;
      --gold: #e6c35c;
      --cream: #fbf6e8;
      --paper: #fffdf7;
      --text: #2f2a1f;
      --accent: #b45309;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #d9d2ba;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--text);
      padding: 24px;
      display: grid;
      place-items: center;
    }
    .poster {
      width: min(900px, 100%);
      background: var(--paper);
      border: 12px solid var(--olive-dark);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
      position: relative;
    }
    .lang-bar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 14px 18px 0;
      flex-wrap: wrap;
      font-family: "Trebuchet MS", system-ui, sans-serif;
    }
    .lang-bar button {
      border: 2px solid #d8c98f;
      background: #fffaf0;
      color: var(--olive-dark);
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
    }
    .lang-bar button.active {
      background: var(--olive-dark);
      color: #fffaf0;
      border-color: var(--olive-dark);
    }
    .photo { position: relative; background: #e8e2cc; margin-top: 10px; }
    .photo img {
      width: 100%;
      display: block;
      max-height: 620px;
      object-fit: cover;
      object-position: center;
    }
    .caption {
      position: absolute;
      left: 18px;
      bottom: 18px;
      background: rgba(50, 64, 26, 0.82);
      color: #fffaf0;
      padding: 10px 14px;
      border-radius: 14px;
      font-family: "Trebuchet MS", system-ui, sans-serif;
      font-size: 1rem;
      max-width: calc(100% - 36px);
    }
    .content { padding: 26px 28px 30px; }
    .flag-it { height: 0.85em; vertical-align: -0.05em; margin-left: 0.25em; border: 1px solid #e2d8b5; border-radius: 2px; }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 4.8vw, 3.2rem);
      color: var(--olive-dark);
      line-height: 1.1;
    }
    .story p { margin: 0 0 0.85rem; font-size: 1.12rem; line-height: 1.55; }
    .story p:last-child { margin-bottom: 0; }
    .hello { font-size: 1.28rem; font-weight: 700; color: var(--olive-dark); }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 18px 0;
    }
    .box {
      background: #f6efda;
      border: 2px solid #e4d5a3;
      border-radius: 16px;
      padding: 14px 16px;
    }
    .box strong {
      display: block;
      font-family: "Trebuchet MS", system-ui, sans-serif;
      color: var(--olive-dark);
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    .box span { font-size: 1.3rem; font-weight: 700; color: var(--accent); }
    .box em { display: block; margin-top: 4px; font-style: normal; font-family: "Trebuchet MS", system-ui, sans-serif; color: #5b523f; }
    .contacts {
      border-top: 3px dashed #dccb8a;
      padding-top: 14px;
      font-family: "Trebuchet MS", system-ui, sans-serif;
    }
    .contacts h2 { margin: 0 0 8px; color: var(--olive-dark); font-size: 1.25rem; }
    .contacts .rows { display: grid; gap: 8px; font-size: 1.08rem; font-weight: 600; }
    .contacts a { color: var(--olive-dark); text-decoration: none; }
    .contacts a:hover { text-decoration: underline; }
    @media print {
      body { background: white; padding: 0; }
      .poster { box-shadow: none; border-radius: 0; width: 100%; }
      .lang-bar { display: none; }
    }
    @media (max-width: 700px) {
      .content { padding: 20px; }
      .info-grid { grid-template-columns: 1fr; }
      .photo img { max-height: 420px; }
    }
  </style>
</head>
<body>
  <article class="poster">
    <nav class="lang-bar" aria-label="Langues / Languages">
      <button type="button" data-lang="fr" class="active">FR</button>
      <button type="button" data-lang="it">IT</button>
      <button type="button" data-lang="de">DE</button>
      <button type="button" data-lang="en">EN</button>
    </nav>

    <div class="photo">
      <img src="Locandina.jpg" alt="Récolte des olives" id="photo-alt" />
      <div class="caption" id="caption"></div>
    </div>
    <div class="content">
      <h1 id="title"></h1>
      <section class="story" id="story"></section>

      <section class="info-grid" aria-label="Informations">
        <div class="box">
          <strong id="price-label"></strong>
          <span>20 CHF / <span id="liter-word"></span></span>
          <em>3L = 60 CHF · 5L = 100 CHF</em>
        </div>
        <div class="box">
          <strong id="formats-label"></strong>
          <span>3L / 5L</span>
          <em id="tins-word"></em>
        </div>
      </section>

      <section class="contacts">
        <h2 id="contacts-title"></h2>
        <div class="rows">
          <div>💬 WhatsApp: <a href="https://wa.me/41768416840" target="_blank" rel="noopener">076 841 68 40</a></div>
          <div>📞 <span id="phone-label"></span>: <a href="tel:+41768416840">076 841 68 40</a></div>
          <div>✉️ Email: <a href="mailto:Michele.antonacci1098@gmail.com">Michele.antonacci1098@gmail.com</a></div>
        </div>
      </section>
    </div>
  </article>

  <script>
    const flag = '<img src="flag-it.svg" alt="Italia" class="flag-it">';
    const content = {
      fr: {
        pageTitle: "Huile d'olive de Bitetto",
        photoAlt: "Mon frère et moi pendant la récolte des olives",
        caption: "Voici mon frère et moi.",
        title: `Huile d'olive extra vierge de Bitetto (BA) ${flag}`,
        story: [
          { text: "Salut, c'est moi l'année dernière, en train de récolter les olives.", hello: true },
          { text: `Ce sont les olives de ma terre, <strong>Bitetto (BA) ${flag}</strong>, d'où vient notre délicieuse huile d'olive extra vierge.` },
          { text: "Cette année, nous en aurons un peu plus, alors j'ai décidé d'essayer de la vendre aussi ici, en Suisse." },
          { text: "J'aurai <strong>50 litres</strong> à vendre, répartis en bidons de <strong>3 L</strong> ou <strong>5 L</strong>. <strong>Faites-moi savoir...</strong>" }
        ],
        priceLabel: "Prix",
        literWord: "litre",
        formatsLabel: "Formats",
        tinsWord: "Bidons",
        contactsTitle: "Contacts pour commander",
        phoneLabel: "Téléphone"
      },
      it: {
        pageTitle: "Olio d'oliva di Bitetto",
        photoAlt: "Io e mio fratello mentre raccogliamo le olive",
        caption: "Questi siamo io e mio fratello.",
        title: `Olio extravergine di Bitetto (BA) ${flag}`,
        story: [
          { text: "Ciao, questo sono io l'anno scorso, mentre raccolgo le olive.", hello: true },
          { text: `Queste sono le olive della mia terra, <strong>Bitetto (BA) ${flag}</strong>, da dove produciamo un olio extravergine di oliva buonissimo.` },
          { text: "Quest'anno ne avremo un po' di più e allora ho deciso di provare a venderlo anche qui in Svizzera." },
          { text: "Avrò <strong>50 litri</strong> da vendere, divisi in lattine da <strong>3L</strong> o <strong>5L</strong> l'una. <strong>Fatemi sapere...</strong>" }
        ],
        priceLabel: "Prezzo",
        literWord: "litro",
        formatsLabel: "Formati",
        tinsWord: "Lattine",
        contactsTitle: "Contatti per ordinare",
        phoneLabel: "Telefono"
      },
      de: {
        pageTitle: "Olivenöl aus Bitetto",
        photoAlt: "Mein Bruder und ich bei der Olivenernte",
        caption: "Das sind mein Bruder und ich.",
        title: `Natives Olivenöl extra aus Bitetto (BA) ${flag}`,
        story: [
          { text: "Hallo, das bin ich letztes Jahr bei der Olivenernte.", hello: true },
          { text: `Das sind die Oliven meiner Heimat, <strong>Bitetto (BA) ${flag}</strong>, wo wir ein sehr gutes natives Olivenöl extra herstellen.` },
          { text: "Dieses Jahr haben wir etwas mehr, und deshalb habe ich beschlossen, es auch hier in der Schweiz zu verkaufen." },
          { text: "Ich werde <strong>50 Liter</strong> verkaufen, aufgeteilt in Kanister zu <strong>3 L</strong> oder <strong>5 L</strong>. <strong>Gebt mir Bescheid...</strong>" }
        ],
        priceLabel: "Preis",
        literWord: "Liter",
        formatsLabel: "Formate",
        tinsWord: "Kanister",
        contactsTitle: "Kontakt für Bestellungen",
        phoneLabel: "Telefon"
      },
      en: {
        pageTitle: "Olive Oil from Bitetto",
        photoAlt: "My brother and I harvesting olives",
        caption: "This is my brother and me.",
        title: `Extra Virgin Olive Oil from Bitetto (BA) ${flag}`,
        story: [
          { text: "Hi, this is me last year, harvesting olives.", hello: true },
          { text: `These are the olives from my hometown, <strong>Bitetto (BA) ${flag}</strong>, where we produce a truly delicious extra virgin olive oil.` },
          { text: "This year we'll have a bit more, so I decided to try selling it here in Switzerland as well." },
          { text: "I will have <strong>50 liters</strong> for sale, divided into <strong>3L</strong> or <strong>5L</strong> tins. <strong>Let me know...</strong>" }
        ],
        priceLabel: "Price",
        literWord: "liter",
        formatsLabel: "Sizes",
        tinsWord: "Tins",
        contactsTitle: "Contact to order",
        phoneLabel: "Phone"
      }
    };

    function setLang(lang) {
      const c = content[lang] || content.fr;
      document.documentElement.lang = lang;
      document.title = c.pageTitle;
      document.getElementById('photo-alt').alt = c.photoAlt;
      document.getElementById('caption').textContent = c.caption;
      document.getElementById('title').innerHTML = c.title;
      document.getElementById('story').innerHTML = c.story.map(p =>
        `<p class="${p.hello ? 'hello' : ''}">${p.text}</p>`
      ).join('');
      document.getElementById('price-label').textContent = c.priceLabel;
      document.getElementById('liter-word').textContent = c.literWord;
      document.getElementById('formats-label').textContent = c.formatsLabel;
      document.getElementById('tins-word').textContent = c.tinsWord;
      document.getElementById('contacts-title').textContent = c.contactsTitle;
      document.getElementById('phone-label').textContent = c.phoneLabel;
      document.querySelectorAll('.lang-bar button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    }

    document.querySelectorAll('.lang-bar button').forEach(btn => {
      btn.addEventListener('click', () => setLang(btn.dataset.lang));
    });

    setLang('fr');
  </script>
</body>
</html>
